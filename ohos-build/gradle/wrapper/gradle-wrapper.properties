# 独立 wrapper，钉 Gradle 8.9。
#
# 为什么不跟宿主的 9.3.1：composite build 里所有成员共用同一个 Gradle 运行时，
# 而 vendor 生态的插件（akinterop 等）还停在 Gradle 8 档 —— akinterop 的
# FfiConventionPlugin 调 ProjectDependency.getDependencyProject()，Gradle 9 已删除，
# 模块一有 project(...) 依赖就 NoSuchMethodError。
# 版本跟 akinterop 自己的 wrapper 对齐（8.9）。
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.9-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
